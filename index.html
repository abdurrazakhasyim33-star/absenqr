
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#2563eb">
  <title>Scanner QR - Absensi Siswa</title>

  <script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/minified/html5-qrcode.min.js"></script>

  <style>
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    body{margin:0;min-height:100vh;background:#f3f6fb;color:#172033;font-family:Arial,Helvetica,sans-serif;padding:18px}
    .app{max-width:520px;margin:0 auto}
    .top{display:flex;align-items:center;gap:12px;margin:8px 0 18px}
    .logo{width:48px;height:48px;border-radius:15px;background:#2563eb;color:#fff;display:grid;place-items:center;font-size:24px}
    h1{font-size:20px;margin:0}
    .sub{font-size:12px;color:#738096;margin-top:4px}
    .card{background:#fff;border-radius:22px;padding:16px;box-shadow:0 8px 28px rgba(20,40,80,.08)}
    .status{padding:13px;border-radius:13px;background:#eff6ff;color:#1d4ed8;font-size:13px;line-height:1.5;text-align:center;margin-bottom:14px}
    .status.error{background:#fef2f2;color:#b91c1c}
    .status.success{background:#ecfdf5;color:#15803d}
    #reader{width:100%;overflow:hidden;border-radius:16px;min-height:60px;background:#f8fafc}
    #reader video{width:100%!important;border-radius:14px}
    .buttons{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px}
    button{height:48px;border:0;border-radius:13px;font-size:14px;font-weight:700;background:#2563eb;color:#fff}
    button.alt{background:#e8eefb;color:#1d4ed8}
    button.stop{background:#fee2e2;color:#b91c1c}
    button:disabled{opacity:.45}
    .result{display:none;margin-top:14px;padding:14px;border-radius:14px;background:#ecfdf5;color:#166534;font-size:13px;line-height:1.6;word-break:break-word}
    .note{font-size:12px;line-height:1.6;color:#7b8798;text-align:center;margin:15px 8px}
  </style>
</head>

<body>
  <main class="app">
    <header class="top">
      <div class="logo">▦</div>
      <div>
        <h1>Scanner QR Absensi</h1>
        <div class="sub">Kamera GitHub • Terhubung ke Apps Script</div>
      </div>
    </header>

    <section class="card">
      <div id="status" class="status">
        Tekan Mulai Kamera untuk mengaktifkan pemindai QR.
      </div>

      <div id="reader"></div>

      <div class="buttons">
        <button id="startBtn" onclick="startScanner('environment')">
          📷 Kamera Belakang
        </button>

        <button id="frontBtn" class="alt" onclick="startScanner('user')">
          🤳 Kamera Depan
        </button>

        <button id="stopBtn" class="stop" onclick="stopScanner()" disabled>
          ■ Stop Kamera
        </button>

        <button id="sendBtn" class="alt" onclick="sendAgain()" disabled>
          Kirim Ulang
        </button>
      </div>

      <div id="result" class="result"></div>
    </section>

    <p class="note">
      Setelah QR terbaca, hasilnya dikirim kembali ke tab aplikasi
      Google Apps Script. Jangan tutup tab aplikasi absensi.
    </p>
  </main>

<script>
'use strict';

let scanner = null;
let running = false;
let sending = false;
let lastDecoded = '';

function setStatus(message, type) {
  const el = document.getElementById('status');
  el.textContent = message;
  el.className = 'status' + (type ? ' ' + type : '');
}

/* MULAI KAMERA */
async function startScanner(mode) {
  if (running || sending) return;

  if (typeof Html5Qrcode === 'undefined') {
    setStatus('Library scanner gagal dimuat. Periksa koneksi internet.', 'error');
    return;
  }

  if (!window.isSecureContext) {
    setStatus('Kamera membutuhkan HTTPS. Buka halaman GitHub Pages.', 'error');
    return;
  }

  document.getElementById('startBtn').disabled = true;
  document.getElementById('frontBtn').disabled = true;
  setStatus('Meminta izin kamera...');

  try {
    if (scanner) {
      try {
        await scanner.clear();
      } catch (e) {}
      scanner = null;
    }

    scanner = new Html5Qrcode('reader');

    const config = {
      fps: 10,
      qrbox: function(width, height) {
        const size = Math.floor(Math.min(width, height) * 0.72);
        return {
          width: size,
          height: size
        };
      },
      aspectRatio: 1.0
    };

    await scanner.start(
      { facingMode: mode },
      config,
      function(decodedText) {
        onDecoded(decodedText);
      },
      function() {
        // Frame yang tidak menemukan QR diabaikan.
      }
    );

    running = true;
    document.getElementById('stopBtn').disabled = false;

    setStatus(
      mode === 'environment'
        ? 'Kamera belakang aktif. Arahkan ke QR siswa.'
        : 'Kamera depan aktif. Arahkan ke QR siswa.',
      'success'
    );

  } catch (error) {
    console.error(error);

    running = false;
    document.getElementById('startBtn').disabled = false;
    document.getElementById('frontBtn').disabled = false;
    document.getElementById('stopBtn').disabled = true;

    setStatus(
      'Kamera gagal dibuka. Izinkan akses kamera di browser atau coba kamera lainnya.',
      'error'
    );
  }
}

/* HENTIKAN KAMERA */
async function stopScanner() {
  if (scanner) {
    try {
      if (running) await scanner.stop();
    } catch (e) {}

    try {
      await scanner.clear();
    } catch (e) {}
  }

  scanner = null;
  running = false;

  document.getElementById('startBtn').disabled = false;
  document.getElementById('frontBtn').disabled = false;
  document.getElementById('stopBtn').disabled = true;

  setStatus('Kamera berhenti. Pilih kamera untuk memulai lagi.');
}

/* QR BERHASIL TERBACA */
async function onDecoded(text) {
  if (sending) return;

  lastDecoded = String(text || '').trim();
  if (!lastDecoded) return;

  sending = true;
  await stopScanner();

  const result = document.getElementById('result');
  result.style.display = 'block';
  result.textContent = 'QR terbaca: ' + lastDecoded + '. Mengirim ke aplikasi absensi...';

  document.getElementById('sendBtn').disabled = false;
  sendAgain();
}

/* KIRIM KE TAB APPS SCRIPT */
function sendAgain() {
  if (!lastDecoded) return;

  if (!window.opener || window.opener.closed) {
    setStatus(
      'Tab aplikasi Apps Script tidak ditemukan. Buka scanner dari tombol di aplikasi absensi.',
      'error'
    );
    sending = false;
    return;
  }

  try {
    window.opener.postMessage(
      {
        type: 'QR_ABSENSI_SCAN_RESULT',
        qrCode: lastDecoded
      },
      '*'
    );

    setStatus('Hasil QR dikirim. Kembali ke tab aplikasi absensi.', 'success');
    document.getElementById('sendBtn').disabled = true;

    setTimeout(function() {
      window.close();
    }, 700);

  } catch (error) {
    console.error(error);
    setStatus('Tidak dapat mengirim hasil scan. Coba lagi.', 'error');
    sending = false;
  }
}

/* BERSIHKAN KAMERA SAAT HALAMAN DITUTUP */
window.addEventListener('beforeunload', function() {
  if (scanner && running) {
    try {
      scanner.stop();
    } catch (e) {}
  }
});
</script>
</body>
</html>
