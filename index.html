
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>QR Scanner - Absensi</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Inter, sans-serif;
    }

    body {
      background: #101827;
      color: white;
      min-height: 100vh;
    }

    .container {
      max-width: 500px;
      min-height: 100vh;
      margin: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
    }

    header {
      text-align: center;
      padding: 20px 0;
    }

    .logo {
      font-size: 35px;
      margin-bottom: 12px;
    }

    header h2 {
      font-size: 21px;
      font-weight: 800;
    }

    header p {
      color: #9aa8bd;
      font-size: 12px;
      margin-top: 7px;
    }

    .scanner-box {
      background: #1c293c;
      padding: 15px;
      border-radius: 22px;
      margin-top: 15px;
      border: 1px solid #33445c;
    }

    #reader {
      width: 100%;
      overflow: hidden;
      border-radius: 15px;
      background: black;
    }

    #reader video {
      object-fit: cover !important;
    }

    #reader img {
      display: none !important;
    }

    .camera-select {
      width: 100%;
      margin-top: 16px;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid #40516b;
      background: #25354c;
      color: white;
      outline: none;
      font-size: 13px;
    }

    .camera-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 12px;
    }

    .camera-buttons button {
      padding: 13px 8px;
      border-radius: 11px;
      background: #2a3b53;
      border: 1px solid #465b77;
      color: white;
      font-size: 12px;
      font-weight: 700;
    }

    .camera-buttons button:active {
      background: #2167df;
    }

    .status-box {
      margin-top: 17px;
      background: #1c293c;
      border-radius: 15px;
      padding: 17px;
      border: 1px solid #33445c;
    }

    .status-title {
      font-size: 12px;
      color: #9aa8bd;
      margin-bottom: 8px;
    }

    #status {
      font-size: 13px;
      font-weight: 700;
      color: #fbbf24;
    }

    .result-box {
      margin-top: 12px;
      padding: 15px;
      background: #142d35;
      border: 1px solid #1f6650;
      border-radius: 14px;
      display: none;
    }

    .result-box h3 {
      font-size: 13px;
      color: #4ade80;
      margin-bottom: 8px;
    }

    #result {
      font-size: 12px;
      color: #d5fbe5;
      word-break: break-all;
    }

    .info {
      margin-top: auto;
      padding: 22px 5px 10px;
      text-align: center;
      color: #8493a9;
      font-size: 11px;
      line-height: 1.8;
    }

    .dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #fbbf24;
      margin-right: 5px;
    }

    .dot.active {
      background: #4ade80;
    }

    .dot.error {
      background: #f87171;
    }

    .back-button {
      width: 100%;
      margin-top: 14px;
      padding: 14px;
      background: #2167df;
      color: white;
      border: none;
      border-radius: 12px;
      font-weight: 700;
      font-size: 13px;
    }

  </style>
</head>

<body>

  <div class="container">

    <header>
      <div class="logo">📷</div>
      <h2>QR ABSENSI SCANNER</h2>
      <p>Live Camera Attendance System</p>
    </header>

    <div class="scanner-box">

      <div id="reader"></div>

      <select id="cameraSelect" class="camera-select">
        <option value="">Mendeteksi kamera...</option>
      </select>

      <div class="camera-buttons">

        <button onclick="switchCamera('environment')">
          📷 Kamera Belakang
        </button>

        <button onclick="switchCamera('user')">
          🤳 Kamera Depan
        </button>

      </div>

    </div>

    <div class="status-box">

      <div class="status-title">STATUS KAMERA</div>

      <div id="status">
        <span class="dot"></span>
        Menyiapkan kamera...
      </div>

      <div class="result-box" id="resultBox">
        <h3>✓ QR CODE TERDETEKSI</h3>
        <div id="result"></div>
      </div>

    </div>

    <button class="back-button" onclick="window.close()">
      Kembali ke Aplikasi Absensi
    </button>

    <div class="info">
      Pastikan QR Code berada di dalam area kamera.<br>
      Hasil scan akan dikirim otomatis ke aplikasi absensi utama.
      <br><br>
      POWERED BY GITHUB PAGES
    </div>

  </div>

  <script>

    let scanner = null;
    let cameras = [];
    let currentCameraId = null;
    let isRunning = false;
    let isSending = false;
    let lastCode = '';
    let lastScanTime = 0;

    const cameraSelect =
      document.getElementById('cameraSelect');

    const statusElement =
      document.getElementById('status');

    const resultBox =
      document.getElementById('resultBox');

    const resultElement =
      document.getElementById('result');

    // =========================
    // STATUS
    // =========================

    function setStatus(message, type) {

      let color = '';

      if (type === 'active') {
        color = 'active';
      } else if (type === 'error') {
        color = 'error';
      }

      statusElement.innerHTML =
        '<span class="dot ' + color + '"></span>' +
        message;
    }

    // =========================
    // INISIALISASI
    // =========================

    async function initializeScanner() {

      try {

        if (!window.isSecureContext) {
          throw new Error(
            'Kamera memerlukan koneksi HTTPS.'
          );
        }

        if (!navigator.mediaDevices ||
            !navigator.mediaDevices.getUserMedia) {
          throw new Error(
            'Browser tidak mendukung akses kamera.'
          );
        }

        scanner = new Html5Qrcode('reader');

        // Meminta izin kamera
        const stream =
          await navigator.mediaDevices.getUserMedia({
            video: {
              facingMode: { ideal: 'environment' }
            }
          });

        // Setelah izin diperoleh, matikan stream sementara.
        stream.getTracks().forEach(track => track.stop());

        await detectCameras();

      } catch (error) {

        setStatus(
          'Gagal membuka kamera: ' + error.message,
          'error'
        );

      }

    }

    // =========================
    // DETEKSI KAMERA
    // =========================

    async function detectCameras() {

      try {

        cameras = await Html5Qrcode.getCameras();

        if (!cameras.length) {
          throw new Error('Tidak ada kamera ditemukan.');
        }

        cameraSelect.innerHTML = '';

        cameras.forEach(function(camera, index) {

          const option = document.createElement('option');

          option.value = camera.id;
          option.textContent =
            camera.label || 'Kamera ' + (index + 1);

          cameraSelect.appendChild(option);

        });

        // Cari kamera belakang
        const rearCamera = cameras.find(function(camera) {
          return /back|rear|environment|belakang/i
            .test(camera.label);
        });

        const selectedCamera =
          rearCamera || cameras[cameras.length - 1];

        await startCamera(selectedCamera.id);

      } catch (error) {

        setStatus(
          'Tidak dapat mendeteksi kamera: ' + error.message,
          'error'
        );

      }

    }

    // =========================
    // MULAI KAMERA
    // =========================

    async function startCamera(cameraId) {

      try {

        if (isRunning) {
          await scanner.stop();
          isRunning = false;
        }

        currentCameraId = cameraId;

        cameraSelect.value = cameraId;

        setStatus('Membuka kamera...', '');

        await scanner.start(
          cameraId,
          {
            fps: 12,
            qrbox: function(width, height) {
              const size = Math.min(
                width * 0.78,
                height * 0.65,
                300
              );

              return {
                width: Math.floor(size),
                height: Math.floor(size)
              };
            },
            aspectRatio: 1
          },
          function(decodedText) {
            handleScan(decodedText);
          },
          function() {
            // Tidak menampilkan error ketika QR belum ditemukan.
          }
        );

        isRunning = true;

        setStatus(
          'Kamera aktif. Arahkan ke QR Code siswa.',
          'active'
        );

      } catch (error) {

        isRunning = false;

        setStatus(
          'Kamera gagal dibuka: ' + error.message,
          'error'
        );

      }

    }

    // =========================
    // PILIH KAMERA
    // =========================

    async function switchCamera(mode) {

      if (!cameras.length) return;

      let targetCamera = null;

      if (mode === 'environment') {

        targetCamera = cameras.find(function(camera) {
          return /back|rear|environment|belakang/i
            .test(camera.label);
        });

        if (!targetCamera && cameras.length > 1) {
          targetCamera = cameras[cameras.length - 1];
        }

      } else {

        targetCamera = cameras.find(function(camera) {
          return /front|user|depan/i.test(camera.label);
        });

        if (!targetCamera && cameras.length > 1) {
          targetCamera = cameras[0];
        }

      }

      if (!targetCamera) {
        setStatus('Kamera pilihan tidak tersedia.', 'error');
        return;
      }

      if (targetCamera.id === currentCameraId && isRunning) {
        return;
      }

      await startCamera(targetCamera.id);

    }

    cameraSelect.addEventListener('change', function() {

      if (cameraSelect.value) {
        startCamera(cameraSelect.value);
      }

    });

    // =========================
    // PEMINDAIAN QR
    // =========================

    function handleScan(decodedText) {

      const now = Date.now();

      if (isSending) return;

      // Menghindari pembacaan QR yang sama berulang kali
      if (
        decodedText === lastCode &&
        now - lastScanTime < 5000
      ) {
        return;
      }

      lastCode = decodedText;
      lastScanTime = now;

      sendResult(decodedText);

    }

    // =========================
    // KIRIM KE APPS SCRIPT
    // =========================

    function sendResult(qrCode) {

      isSending = true;

      resultBox.style.display = 'block';

      resultElement.textContent = qrCode;

      setStatus(
        'QR terdeteksi. Mengirim ke aplikasi absensi...',
        'active'
      );

      if (!window.opener || window.opener.closed) {

        setStatus(
          'Aplikasi utama tidak ditemukan. Buka scanner dari aplikasi absensi.',
          'error'
        );

        isSending = false;
        return;

      }

      try {

        window.opener.postMessage(
          {
            type: 'QR_ABSENSI_SCAN_RESULT',
            qrCode: qrCode
          },
          'https://script.google.com'
        );

        setStatus(
          'Hasil scan berhasil dikirim ke aplikasi utama.',
          'active'
        );

      } catch (error) {

        setStatus(
          'Gagal mengirim hasil scan: ' + error.message,
          'error'
        );

      }

      // Beri jeda sebelum menerima QR berikutnya.
      setTimeout(function() {
        isSending = false;
      }, 3000);

    }

    // =========================
    // JALANKAN SCANNER
    // =========================

    window.addEventListener('load', function() {
      initializeScanner();
    });

    // Hentikan kamera ketika halaman ditutup
    window.addEventListener('pagehide', function() {

      if (scanner && isRunning) {
        scanner.stop().catch(function() {});
      }

    });

  </script>

</body>
</html>
