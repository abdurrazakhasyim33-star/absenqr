
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1">

  <title>Scanner Absensi QR</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      padding: 20px 15px;
      min-height: 100vh;
      background: #f4f5fb;
      font-family: Arial, sans-serif;
      color: #20243a;
    }

    .container {
      width: 100%;
      max-width: 480px;
      margin: auto;
    }

    .header {
      text-align: center;
      padding: 15px 10px 22px;
    }

    .logo {
      width: 65px;
      height: 65px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: auto auto 12px;
      background: #eae8ff;
      color: #6759e8;
      border-radius: 20px;
      font-size: 30px;
    }

    .header h1 {
      margin: 0 0 7px;
      font-size: 22px;
    }

    .header p {
      margin: 0;
      font-size: 12px;
      color: #85899d;
    }

    .scanner-card {
      background: white;
      border-radius: 20px;
      padding: 15px;
      box-shadow: 0 5px 20px rgba(35,38,75,.07);
    }

    #reader {
      width: 100%;
      overflow: hidden;
      border-radius: 14px;
      background: #151525;
      min-height: 260px;
    }

    #reader video {
      object-fit: cover !important;
      border-radius: 14px;
    }

    #reader img {
      max-width: 100%;
    }

    .status {
      text-align: center;
      margin: 14px 0;
      padding: 12px;
      border-radius: 11px;
      background: #f0efff;
      color: #6759e8;
      font-size: 12px;
      line-height: 1.5;
    }

    .status.success {
      background: #e7f9f1;
      color: #15976a;
    }

    .status.error {
      background: #fff0f1;
      color: #d83d55;
    }

    .camera-controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9px;
      margin-top: 13px;
    }

    button {
      border: none;
      border-radius: 11px;
      padding: 13px 9px;
      font-weight: bold;
      font-size: 12px;
      cursor: pointer;
    }

    .primary {
      background: #6759e8;
      color: white;
    }

    .secondary {
      background: #efedff;
      color: #6759e8;
    }

    .result-card {
      margin-top: 14px;
      padding: 15px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 5px 20px rgba(35,38,75,.05);
      display: none;
    }

    .result-card h3 {
      margin: 0 0 8px;
      font-size: 14px;
    }

    .result-code {
      background: #f5f6fc;
      padding: 12px;
      border-radius: 9px;
      font-size: 13px;
      overflow-wrap: anywhere;
      margin-bottom: 12px;
    }

    .footer {
      text-align: center;
      font-size: 10px;
      color: #999;
      padding: 20px 0;
    }

    #loading {
      text-align: center;
      color: #85899d;
      font-size: 12px;
      padding: 15px;
    }

    @media(max-width:360px) {
      body {
        padding: 12px 9px;
      }

      .scanner-card {
        padding: 10px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <header class="header">
      <div class="logo">▦</div>
      <h1>Scanner Absensi QR</h1>
      <p>Scan QR Code siswa untuk mencatat kehadiran</p>
    </header>


    <div class="scanner-card">

      <div id="loading">
        Memuat sistem kamera...
      </div>

      <div id="reader"></div>

      <div id="scannerStatus" class="status">
        Menyiapkan scanner...
      </div>

      <div class="camera-controls">

        <button class="primary" onclick="startCamera()">
          📷 MULAI SCAN
        </button>

        <button class="secondary" onclick="stopCamera()">
          ■ HENTIKAN
        </button>

        <button class="secondary" onclick="switchCamera()">
          🔄 GANTI KAMERA
        </button>

        <button class="secondary" onclick="scanAgain()">
          ↻ SCAN LAGI
        </button>

      </div>

    </div>


    <div id="resultCard" class="result-card">

      <h3>QR Code Berhasil Dibaca</h3>

      <div id="resultCode" class="result-code"></div>

      <div class="status success">
        Mengirim hasil scan ke aplikasi absensi...
      </div>

      <button class="primary"
        style="width:100%;"
        onclick="scanAgain()">
        SCAN SISWA BERIKUTNYA
      </button>

    </div>


    <div class="footer">
      Sistem Absensi QR Siswa
    </div>

  </div>


  <script>
    let html5QrCode = null;
    let cameras = [];
    let selectedCameraId = null;
    let scanning = false;
    let processing = false;
    let lastScannedCode = '';


    function setStatus(message, type) {

      const el = document.getElementById('scannerStatus');

      el.textContent = message;
      el.className = 'status ' + (type || '');

    }


    function loadLibrary() {

      return new Promise(function(resolve, reject) {

        if (window.Html5Qrcode) {
          resolve();
          return;
        }

        const urls = [
          'https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js',
          'https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js'
        ];

        let index = 0;

        function tryNext() {

          if (window.Html5Qrcode) {
            resolve();
            return;
          }

          if (index >= urls.length) {
            reject(new Error('Library scanner gagal dimuat. Periksa koneksi internet.'));
            return;
          }

          const script = document.createElement('script');

          script.src = urls[index++];

          script.onload = function() {
            if (window.Html5Qrcode) {
              resolve();
            } else {
              tryNext();
            }
          };

          script.onerror = tryNext;

          document.head.appendChild(script);

        }

        tryNext();

      });

    }


    async function initializeScanner() {

      try {

        await loadLibrary();

        document.getElementById('loading').style.display = 'none';

        html5QrCode = new Html5Qrcode('reader');

        setStatus('Scanner siap. Tekan MULAI SCAN.', '');

        await getCameraList();

      } catch (error) {

        document.getElementById('loading').textContent =
          error.message;

        setStatus(error.message, 'error');

      }

    }


    async function getCameraList() {

      try {

        cameras = await Html5Qrcode.getCameras();

        if (!cameras || cameras.length === 0) {
          setStatus('Kamera tidak ditemukan pada perangkat ini.', 'error');
          return;
        }

        const backCamera = cameras.find(function(camera) {
          return /back|rear|environment|belakang/i.test(camera.label);
        });

        selectedCameraId =
          backCamera ? backCamera.id : cameras[cameras.length - 1].id;

      } catch (error) {

        setStatus(
          'Tidak dapat mengakses daftar kamera. Pastikan izin kamera diberikan.',
          'error'
        );

      }

    }


    async function startCamera() {

      if (!html5QrCode) {
        setStatus('Scanner belum siap. Muat ulang halaman.', 'error');
        return;
      }

      if (scanning) return;

      if (!selectedCameraId) {
        await getCameraList();
      }

      if (!selectedCameraId) {
        setStatus('Kamera tidak tersedia.', 'error');
        return;
      }

      try {

        document.getElementById('resultCard').style.display = 'none';

        await html5QrCode.start(
          selectedCameraId,
          {
            fps: 10,
            qrbox: function(width, height) {

              const size = Math.floor(
                Math.min(width, height) * 0.72
              );

              return {
                width: size,
                height: size
              };

            },
            aspectRatio: 1.0
          },
          onScanSuccess,
          function() {}
        );

        scanning = true;

        setStatus('Kamera aktif. Arahkan QR Code ke kamera.', 'success');

      } catch (error) {

        scanning = false;

        setStatus(
          'Kamera gagal dibuka. Izinkan akses kamera dan coba lagi. ' +
          error.message,
          'error'
        );

      }

    }


    async function stopCamera() {

      if (!html5QrCode || !scanning) {
        setStatus('Kamera sedang tidak aktif.', '');
        return;
      }

      try {

        await html5QrCode.stop();

        scanning = false;

        setStatus('Kamera dihentikan.', '');

      } catch (error) {

        setStatus('Gagal menghentikan kamera.', 'error');

      }

    }


    async function switchCamera() {

      if (!cameras.length) {
        await getCameraList();
      }

      if (cameras.length < 2) {
        setStatus('Perangkat hanya memiliki satu kamera.', '');
        return;
      }

      const wasScanning = scanning;

      if (wasScanning) {
        await stopCamera();
      }

      const currentIndex = cameras.findIndex(function(camera) {
        return camera.id === selectedCameraId;
      });

      const nextIndex = (currentIndex + 1) % cameras.length;

      selectedCameraId = cameras[nextIndex].id;

      setStatus(
        'Kamera dipilih: ' + cameras[nextIndex].label,
        ''
      );

      if (wasScanning) {
        await startCamera();
      }

    }


    async function onScanSuccess(decodedText) {

      if (processing) return;

      const qrCode = String(decodedText || '').trim();

      if (!qrCode || qrCode === lastScannedCode) return;

      processing = true;
      lastScannedCode = qrCode;

      try {

        if (scanning) {
          await html5QrCode.stop();
          scanning = false;
        }

      } catch (error) {}

      document.getElementById('resultCode').textContent = qrCode;

      document.getElementById('resultCard').style.display = 'block';

      setStatus('QR berhasil dipindai.', 'success');

      sendResultToApp(qrCode);

    }


    function sendResultToApp(qrCode) {

      if (!window.opener || window.opener.closed) {

        setStatus(
          'Aplikasi utama tidak ditemukan. Buka scanner dari tombol BUKA SCANNER di aplikasi Apps Script.',
          'error'
        );

        processing = false;
        return;

      }

      window.opener.postMessage(
        {
          type: 'QR_ABSENSI_SCAN_RESULT',
          qrCode: qrCode
        },
        '*'
      );

      setStatus(
        'Hasil scan dikirim. Periksa tab aplikasi absensi.',
        'success'
      );

    }


    async function scanAgain() {

      processing = false;
      lastScannedCode = '';

      document.getElementById('resultCard').style.display = 'none';

      setStatus('Siap melakukan pemindaian berikutnya.', '');

      await startCamera();

    }


    document.addEventListener('visibilitychange', function() {

      if (document.hidden && scanning) {
        stopCamera();
      }

    });


    window.addEventListener('load', initializeScanner);

  </script>

</body>
</html>
